
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="다양한 언론사의 최신 뉴스와 실시간 주요 키워드를 한곳에서 확인하세요.">

  <title>NEWS HUB | 실시간 뉴스</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <div class="header-inner">
    <a class="logo" href="./">
      NEWS<span>HUB</span>
    </a>

    <div class="header-status">
      <span class="status-dot"></span>
      NEWS LIVE
    </div>
  </div>
</header>

<main class="container">

  <section class="hero">
    <div class="hero-label">KOREA NEWS AGGREGATOR</div>
    <h1>세상의 소식을<br><span>한눈에.</span></h1>
    <p>다양한 뉴스 매체의 최신 소식과 주요 이슈를 확인하세요.</p>
  </section>

  <section class="search-section">
    <div class="search-box">
      <span class="search-icon">⌕</span>

      <input
        id="searchInput"
        type="search"
        placeholder="뉴스 키워드를 검색하세요."
        autocomplete="off"
      >

      <button id="searchBtn" class="search-btn">
        검색
      </button>
    </div>
  </section>

  <section class="keyword-section">

    <div class="section-heading">
      <div>
        <div class="section-label">TRENDING NOW</div>
        <h2>실시간 주요 키워드</h2>
      </div>

      <button id="keywordRefresh" class="icon-btn" title="키워드 갱신">
        ↻
      </button>
    </div>

    <p id="keywordInfo" class="keyword-info">
      최신 뉴스 제목을 분석하고 있습니다.
    </p>

    <div id="keywordList" class="keyword-list">
      <div class="placeholder">키워드 분석 중...</div>
    </div>

  </section>

  <section class="news-section">

    <div class="section-heading news-heading">
      <div>
        <div class="section-label">LATEST UPDATES</div>
        <h2>최신 뉴스</h2>
      </div>

      <button id="refreshBtn" class="refresh-btn">
        ↻ 새로고침
      </button>
    </div>

    <nav class="category-list" id="categories">
    </nav>

    <div class="news-toolbar">
      <div>
        <strong>뉴스</strong>
        <span id="newsCount">0</span>
        <span class="toolbar-unit">개</span>
      </div>

      <div id="updatedAt" class="updated-time">
        업데이트 대기 중
      </div>
    </div>

    <div id="newsList" class="news-grid">
      <div class="placeholder">최신 뉴스를 불러오고 있습니다...</div>
    </div>

    <div id="errorArea" class="error-area" hidden></div>

  </section>

</main>

<footer class="footer">
  <div class="footer-logo">NEWS HUB</div>
  <p>뉴스 데이터는 Google 뉴스 RSS를 통해 제공됩니다.</p>
  <p>기사의 저작권은 각 언론사 및 원저작권자에게 있습니다.</p>
  <div class="copyright">© NEWS HUB</div>
</footer>

<script src="script.js"></script>

</body>
</html>
